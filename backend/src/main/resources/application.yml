llm:
  api-key: ${DASHSCOPE_API_KEY}
  model-name: qwen3-max
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

ocr:
  base-url: http://127.0.0.1:18000
  path: /ocr

arena:
  ocr:
    async:
      exchange: arena.ocr
      request-queue: arena.ocr.requests
      result-queue: arena.ocr.results
      request-routing-key: ocr.request
      result-routing-key: ocr.result
  session:
    store-type: in-memory
    ttl: PT12H
    redis-map-name: arena:draft:sessions
    lock-key-prefix: arena:draft:locks:sessions
  analysis:
    cache-ttl: PT10M
    redis-map-name: arena:draft:analysis-cache
    lock-key-prefix: arena:draft:locks:analyze
  redis:
    address: redis://127.0.0.1:6379
    database: 0
    client-name: arena-agent
    connect-timeout: PT10S
    timeout: PT3S
    lock-watchdog-timeout: PT30S

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
